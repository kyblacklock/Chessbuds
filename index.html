<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chessbuds</title>
<meta name="description" content="Chess with character. 3D chess in your browser, played with pieces who have personality.">
<meta property="og:title" content="Chessbuds — Chess with character.">
<meta property="og:description" content="Chess with character.">
<meta property="og:image" content="https://chessbuds.com/thumbnail.png">
<meta property="og:url" content="https://chessbuds.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chessbuds.com/thumbnail.png">
<link rel="icon" type="image/png" href="King Favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">

<!-- Importmap MUST come before modulepreload tags below, so the browser
     can resolve the bare "three" specifier that the addon modules import. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<!-- High-priority preloads for the landing's 3D viewer — start fetching
     during HTML parse instead of waiting for the module script to run. -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/loaders/STLLoader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/utils/BufferGeometryUtils.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js" crossorigin>
<!-- Loader cycles through all six piece icons — preload King at high
     priority (first one shown), the rest at idle so they're ready in
     time for the cycle. -->
<link rel="preload" href="Chessbuds Icons/King Icon.png" as="image" fetchpriority="high">
<link rel="preload" href="Chessbuds Icons/Queen Icon.png" as="image">
<link rel="preload" href="Chessbuds Icons/Bishop Icon.png" as="image">
<link rel="preload" href="Chessbuds Icons/Knight Icon.png" as="image">
<link rel="preload" href="Chessbuds Icons/Rook Icon.png" as="image">
<link rel="preload" href="Chessbuds Icons/Pawn Icon.png" as="image">
<link rel="preload" href="King.stl" as="fetch" fetchpriority="high">

<!-- Warm up the game while the landing is visible. Three.js + King.stl are
     loaded by the landing — when the user clicks Play, the rest of the
     game opens near-instantly from cache. -->
<link rel="prefetch" href="play/" as="document">
<link rel="prefetch" href="engine.js" as="script">
<link rel="prefetch" href="ai.js" as="script">
<link rel="prefetch" href="profile.js" as="script">
<link rel="prefetch" href="about.js" as="script">
<link rel="prefetch" href="legal.js" as="script">
<link rel="prefetch" href="game.js" as="script">
<link rel="prefetch" href="Queen.stl">
<link rel="prefetch" href="Rook.stl">
<link rel="prefetch" href="Bishop.stl">
<link rel="prefetch" href="Knight.stl">
<link rel="prefetch" href="Pawn.stl">

<style>
  /* ── Light palette override (Apple × board game) ───── */
  :root {
    --bg: #F4EFE6;            /* warm ivory — aged paper / light chess square */
    --bg-elevated: #FBF8F1;
    --text: #1F1810;          /* deep warm near-black */
    --text-dim: #6E6359;      /* warm gray-brown */
    --text-muted: #A99F93;    /* soft warm gray */
    --border: rgba(31, 24, 16, 0.10);
    --border-hover: rgba(31, 24, 16, 0.22);
    --surface: rgba(255, 251, 244, 0.72);
    --accent: #B8842D;        /* deeper bronze, reads on cream */
    --accent-dim: rgba(184, 132, 45, 0.45);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 100dvh;
    /* Reserve space at the bottom for the fixed .site-footer (Privacy · Terms)
       so hero content never gets overlapped by it. */
    padding-bottom: 44px;
    /* Very faint warm radial — adds depth without texture */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255, 245, 220, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(216, 180, 130, 0.18) 0%, transparent 60%);
  }

  /* ── Top bar ────────────────────────────────────────── */
  .landing-top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px clamp(20px, 3vw, 40px);
    z-index: 10;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--text);
    opacity: 0.85;
    text-decoration: none;
    transition: opacity 0.3s ease;
  }
  .brand-mark:hover { opacity: 1; }
  .brand-mark-icon {
    height: 1.65em;
    width: auto;
    display: block;
    /* Slight nudge so the lion's visual center aligns with the wordmark
       baseline (the crown adds extra height above the head). */
    margin-top: -0.08em;
    -webkit-user-drag: none;
    user-select: none;
  }

  .landing-nav {
    display: flex;
    gap: clamp(18px, 2.4vw, 32px);
  }
  .landing-nav a {
    font-size: clamp(11px, 0.95vw, 12px);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .landing-nav a:hover { color: var(--text); }

  /* ── Hero ───────────────────────────────────────────── */
  .landing-hero {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    align-items: center;
    padding: clamp(8px, 2vw, 24px) clamp(20px, 3vw, 40px);
    gap: clamp(20px, 3vw, 48px);
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }

  .hero-text {
    min-width: 0;
    padding-left: clamp(0px, 3vw, 36px);
    max-width: 660px;
  }

  .hero-headline {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(40px, 5.8vw, 92px);
    line-height: 1.02;
    letter-spacing: -0.022em;
    color: var(--text);
    margin: 0;
    font-optical-sizing: auto;
    font-feature-settings: "kern", "liga", "calt";
    text-rendering: geometricPrecision;
  }

  .hero-subline {
    margin-top: clamp(16px, 1.8vw, 22px);
    font-size: clamp(15px, 1.15vw, 18px);
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--text-dim);
    max-width: 640px;
  }

  .cta-row {
    margin-top: clamp(28px, 3vw, 42px);
    display: flex;
    align-items: center;
    gap: clamp(20px, 2.4vw, 32px);
    flex-wrap: wrap;
  }

  .cta-primary,
  .cta-primary:link,
  .cta-primary:visited {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px clamp(34px, 3.6vw, 46px);
    border: 1px solid var(--text);
    border-radius: 999px;
    background: var(--text);
    color: var(--bg);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(12px, 1vw, 14px);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(31, 24, 16, 0.10),
                0 6px 16px rgba(31, 24, 16, 0.08);
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1),
                box-shadow 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
    white-space: nowrap;
  }
  .cta-primary:hover,
  .cta-primary:focus,
  .cta-primary:focus-visible {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(31, 24, 16, 0.10),
                0 12px 28px rgba(31, 24, 16, 0.15);
    outline: none;
  }
  .cta-primary:active {
    background: var(--text);
    color: var(--bg);
    transform: translateY(0);
    box-shadow: 0 1px 2px rgba(31, 24, 16, 0.12);
  }

  .cta-secondary {
    font-size: clamp(13px, 1.05vw, 15px);
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.3s ease;
    white-space: nowrap;
  }
  .cta-secondary:hover { color: var(--text); }
  .cta-secondary .arrow {
    display: inline-block;
    transition: transform 0.35s ease;
    margin-left: 6px;
    opacity: 0.7;
  }
  .cta-secondary:hover .arrow { transform: translateX(4px); opacity: 1; }

  /* ── 3D viewer ─────────────────────────────────────── */
  .hero-viewer {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* let OrbitControls handle touch drag */
  }
  .hero-viewer.dragging { cursor: grabbing; }

  #hero-canvas {
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .hero-viewer.loaded #hero-canvas { opacity: 1; }

  /* ── Full-screen initial loader ────────────────────── */
  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    pointer-events: auto;
    transition: opacity 0.6s ease;
    overflow: hidden;
    --mx: -300px;
    --my: -300px;
    /* Match body bg layering so the fade-out reveals the same warm field */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255, 245, 220, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(216, 180, 130, 0.18) 0%, transparent 60%);
  }

  /* Subtle chess-board pattern revealed under the cursor (loader only).
     Tone-on-tone with the landing's warm ivory bg.
     --mx/--my are updated from JS. */
  .loader-checker {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      linear-gradient(45deg, rgba(31, 24, 16, 0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(31, 24, 16, 0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(31, 24, 16, 0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(31, 24, 16, 0.06) 75%);
    background-size: 72px 72px;
    background-position: 0 0, 0 36px, 36px -36px, -36px 0;
    -webkit-mask-image: radial-gradient(circle 340px at var(--mx) var(--my),
      rgba(0,0,0,0.9) 0%,
      rgba(0,0,0,0.55) 35%,
      rgba(0,0,0,0.18) 70%,
      transparent 100%);
    mask-image: radial-gradient(circle 340px at var(--mx) var(--my),
      rgba(0,0,0,0.9) 0%,
      rgba(0,0,0,0.55) 35%,
      rgba(0,0,0,0.18) 70%,
      transparent 100%);
    transition: opacity 0.4s ease;
  }
  body.page-ready .page-loader {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
  }
  /* Cycle through all six piece icons with a soft crossfade. Each icon
     has its own slot in a 6s loop; offsets stagger them by ~1s so they
     enter in sequence with a brief overlap between adjacent icons. */
  .loading-icon-stack {
    position: relative;
    z-index: 2;
    width: clamp(80px, 8vw, 112px);
    height: clamp(80px, 8vw, 112px);
  }
  .loading-bar,
  .loading-percent { position: relative; z-index: 2; }
  .loading-icon-stack img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    animation: icon-cycle 6s ease-in-out infinite;
    will-change: opacity, transform, filter;
  }
  .loading-icon-stack img:nth-child(1) { animation-delay:  0s; } /* King */
  .loading-icon-stack img:nth-child(2) { animation-delay: -5s; } /* Queen */
  .loading-icon-stack img:nth-child(3) { animation-delay: -4s; } /* Bishop */
  .loading-icon-stack img:nth-child(4) { animation-delay: -3s; } /* Knight */
  .loading-icon-stack img:nth-child(5) { animation-delay: -2s; } /* Rook */
  .loading-icon-stack img:nth-child(6) { animation-delay: -1s; } /* Pawn */

  @keyframes icon-cycle {
    0%   { opacity: 0; transform: scale(0.94);
           filter: drop-shadow(0 0 6px rgba(184, 132, 45, 0.18)); }
    5%   { opacity: 1; transform: scale(1.0);
           filter: drop-shadow(0 0 22px rgba(220, 150, 80, 0.55)); }
    14%  { opacity: 1; transform: scale(1.0);
           filter: drop-shadow(0 0 22px rgba(220, 150, 80, 0.55)); }
    20%  { opacity: 0; transform: scale(0.94);
           filter: drop-shadow(0 0 6px rgba(184, 132, 45, 0.18)); }
    100% { opacity: 0; transform: scale(0.94); }
  }
  .loading-bar {
    width: 180px;
    height: 1px;
    background: rgba(31, 24, 16, 0.10);
    position: relative;
    overflow: hidden;
    border-radius: 1px;
  }
  .loading-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--text);
  }
  .loading-percent {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    min-width: 4ch;
    text-align: center;
  }

  /* ── Page chrome fades + lifts in once loader is done ── */
  .landing-top,
  .landing-hero,
  .site-footer {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.9s cubic-bezier(0.2, 0.7, 0.2, 1),
                transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  body.page-ready .landing-top  { opacity: 1; transform: none; transition-delay: 0.05s; }
  body.page-ready .landing-hero { opacity: 1; transform: none; transition-delay: 0.15s; }
  body.page-ready .site-footer  { opacity: 1; transform: none; transition-delay: 0.30s; }

  .viewer-meta {
    position: absolute;
    left: clamp(16px, 2vw, 32px);
    bottom: clamp(20px, 2.2vw, 32px);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: clamp(10px, 1vw, 14px);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.7s ease 0.1s, transform 0.7s ease 0.1s;
  }
  .hero-viewer.loaded .viewer-meta {
    opacity: 1;
    transform: translateY(0);
  }
  .viewer-piece-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: clamp(20px, 1.8vw, 26px);
    color: var(--text);
    opacity: 0.82;
    line-height: 1;
    transition: opacity 0.22s ease;
  }
  .viewer-piece-name.fading { opacity: 0; }

  .viewer-dots {
    position: absolute;
    right: clamp(16px, 2vw, 32px);
    bottom: clamp(22px, 2.4vw, 36px);
    display: flex;
    gap: 10px;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.7s ease 0.25s;
  }
  .hero-viewer.loaded .viewer-dots { opacity: 1; }
  .viewer-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text);
    opacity: 0.22;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: opacity 0.3s ease, background 0.3s ease, transform 0.3s ease;
  }
  .viewer-dot:hover { opacity: 0.55; }
  .viewer-dot.active {
    background: var(--accent);
    opacity: 1;
    transform: scale(1.3);
  }

  /* Footer (.site-footer) is auto-injected by legal.js with Privacy · Terms,
     styled in styles.css. We just reserve bottom padding on body for it. */

  /* ── Responsive ────────────────────────────────────── */

  /* Tablet/landscape — keep split but tighten */
  @media (max-width: 1080px) {
    .hero-text { padding-left: 0; }
  }

  /* Stack: portrait tablets & phones */
  @media (max-width: 760px) {
    .landing-hero {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      align-items: stretch;
      padding: 8px clamp(18px, 5vw, 28px) 12px;
      gap: 8px;
    }
    .hero-text {
      max-width: 100%;
      text-align: center;
      order: 2;
      padding: 0 4px clamp(4px, 1vw, 12px);
    }
    .hero-subline {
      margin-left: auto;
      margin-right: auto;
    }
    .cta-row {
      justify-content: center;
      margin-top: 22px;
    }
    .hero-viewer {
      order: 1;
      min-height: 200px;
    }
    .viewer-meta {
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      align-items: center;
      bottom: 12px;
    }
    .hero-viewer.loaded .viewer-meta {
      transform: translateX(-50%) translateY(0);
    }
    .viewer-dots {
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      bottom: -2px;
    }
  }

  /* Phones */
  @media (max-width: 480px) {
    .landing-top { padding: 16px 18px; }
    .landing-nav { gap: 14px; }
    .hero-headline { font-size: clamp(36px, 11vw, 60px); }
    .cta-primary { padding: 13px 30px; }
  }

  /* Very narrow — drop "About" (least critical) to keep the bar fitting */
  @media (max-width: 360px) {
    .landing-nav a:nth-child(2) { display: none; }
  }

  /* Short viewports (laptops in landscape) */
  @media (max-height: 640px) and (min-width: 761px) {
    .hero-subline { display: none; }
    .cta-row { margin-top: 26px; }
    .hero-headline { font-size: clamp(36px, 5.2vw, 76px); }
  }

  @media (max-height: 520px) and (max-width: 760px) {
    .hero-subline { display: none; }
    .cta-row { margin-top: 14px; }
    .viewer-meta { display: none; }
    .landing-hero { padding-top: 4px; padding-bottom: 4px; }
  }

  @media (max-height: 420px) {
    .landing-top { padding-top: 10px; padding-bottom: 10px; }
  }
</style>
</head>

<!-- Footer (Privacy · Terms) is auto-injected by legal.js (loaded below). -->

<script>
  (() => {
    const loader = document.getElementById('page-loader');
    if (!loader) return;
    let x = 0, y = 0, pending = false;
    function tick() {
      loader.style.setProperty('--mx', x + 'px');
      loader.style.setProperty('--my', y + 'px');
      pending = false;
    }
    window.addEventListener('pointermove', (e) => {
      x = e.clientX; y = e.clientY;
      if (!pending) { pending = true; requestAnimationFrame(tick); }
    }, { passive: true });
  })();
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const PIECES = [
  { name: 'King Leo Longmane',       file: 'King.stl',   height: 2.10 },
  { name: 'Queen Beatrix the Brave', file: 'Queen.stl',  height: 1.95 },
  { name: 'Big Bishop Bernard',      file: 'Bishop.stl', height: 1.65 },
  { name: 'Nigel Knight',            file: 'Knight.stl', height: 1.55 },
  { name: "Rook O'Roark",            file: 'Rook.stl',   height: 1.40 },
  { name: 'Pawdrick the Pawn',       file: 'Pawn.stl',   height: 1.20 },
];

const viewer = document.getElementById('hero-viewer');
const canvas = document.getElementById('hero-canvas');
const pieceName = document.getElementById('viewer-piece-name');
const dotsRow = document.getElementById('viewer-dots');
const loadingBar = document.getElementById('loading-bar-fill');
const loadingPercent = document.getElementById('loading-percent');

function setLoadingProgress(pct) {
  const clamped = Math.max(0, Math.min(100, pct));
  loadingBar.style.width = clamped + '%';
  loadingPercent.textContent = Math.round(clamped);
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
camera.position.set(0, 2.2, 6);
camera.lookAt(0, 1.0, 0);

// Soft studio lighting — sky/ground bounce + warm key + subtle fill
const hemi = new THREE.HemisphereLight(0xFFF4DD, 0xD9CCB5, 0.95);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.6);
keyLight.position.set(3.5, 7, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.camera.left = -3;
keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0008;
keyLight.shadow.radius = 6;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xFFE8C8, 0.35);
fillLight.position.set(-5, 3, -1);
scene.add(fillLight);

// Subtle chess-board ground plane — the piece rests on a board
// with a soft radial vignette so the board fades into the page.
function makeBoardTexture() {
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const sq = size / 8;
  // Light squares (slightly lighter than page bg)
  ctx.fillStyle = '#FBF6EC';
  ctx.fillRect(0, 0, size, size);
  // Dark squares (gently warmer/darker than bg)
  ctx.fillStyle = '#E2D7C0';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 === 1) ctx.fillRect(c * sq, r * sq, sq, sq);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function makeBoardAlphaMap() {
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, size*0.10, size/2, size/2, size*0.48);
  g.addColorStop(0,    '#FFFFFF');
  g.addColorStop(0.55, '#FFFFFF');
  g.addColorStop(1,    '#000000');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(cv);
}

const boardSize = 6.0; // 8 squares → ~0.75 units per square; King ~0.6 wide → 1 square per piece
const board = new THREE.Mesh(
  new THREE.PlaneGeometry(boardSize, boardSize),
  new THREE.MeshStandardMaterial({
    map: makeBoardTexture(),
    alphaMap: makeBoardAlphaMap(),
    roughness: 0.92,
    metalness: 0.0,
    transparent: true,
    depthWrite: false
  })
);
board.rotation.x = -Math.PI / 2;
board.position.y = -0.001;     // sit just below piece origin to avoid z-fighting
board.receiveShadow = true;
scene.add(board);

// Polished graphite — warm medium grey with lacquer clearcoat.
const material = new THREE.MeshPhysicalMaterial({
  color: 0x6E665B,
  roughness: 0.34,
  metalness: 0.0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.22,
  sheen: 0.3,
  sheenColor: 0xD4CABC
});

function processGeometry(geometry, targetHeight) {
  let geo = BufferGeometryUtils.mergeVertices(geometry, 0.0005);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const center = new THREE.Vector3(); bb.getCenter(center);
  const size = new THREE.Vector3(); bb.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetHeight / maxDim;
  const posArr = geo.getAttribute('position').array;
  for (let i = 0; i < posArr.length; i += 3) {
    posArr[i]     = (posArr[i]     - center.x) * scale;
    posArr[i + 1] = (posArr[i + 1] - bb.min.y) * scale;
    posArr[i + 2] = (posArr[i + 2] - center.z) * scale;
  }
  geo.getAttribute('position').needsUpdate = true;
  geo.computeBoundingBox();
  geo.computeVertexNormals();
  return geo;
}

const loader = new STLLoader();
const cache = {};

async function loadPiece(idx, onProgress) {
  const p = PIECES[idx];
  if (cache[p.file]) {
    onProgress?.(1);
    return cache[p.file];
  }
  const response = await fetch(p.file);
  if (!response.ok) throw new Error('Failed to load ' + p.file);

  // Stream so we can surface real download progress.
  const total = +response.headers.get('Content-Length') || 0;
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total && onProgress) onProgress(received / total);
  }
  if (onProgress) onProgress(1);

  const buf = new Uint8Array(received);
  let offset = 0;
  for (const chunk of chunks) { buf.set(chunk, offset); offset += chunk.length; }

  let geo = loader.parse(buf.buffer);
  geo = processGeometry(geo, p.height);
  cache[p.file] = geo;
  return geo;
}

let mesh = null;
let currentIdx = 0;
let isTransitioning = false;

// Auto-cycle to next piece every 10s. Resets on manual cycle, pauses
// during drag and when the tab isn't visible.
const AUTO_CYCLE_MS = 10000;
let autoCycleTimer;
function scheduleAutoCycle() {
  clearTimeout(autoCycleTimer);
  if (document.hidden) return;
  autoCycleTimer = setTimeout(() => {
    showPiece((currentIdx + 1) % PIECES.length);
  }, AUTO_CYCLE_MS);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(autoCycleTimer);
  else scheduleAutoCycle();
});

// OrbitControls — drag to rotate, no zoom/pan, with damping & auto-rotate
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.3;            // ~46s per orbit — meditative
controls.minPolarAngle = Math.PI * 0.18;   // don't allow look-from-above
controls.maxPolarAngle = Math.PI * 0.55;   // or look-from-below the board
controls.target.set(0, 1.0, 0);
controls.update();

// Visual cursor feedback only — auto-rotation keeps running through drags
// so the piece never feels frozen. The user's drag input layers on top.
// Also pause/resume the 10s auto-cycle around drags so a piece doesn't
// swap out from under someone inspecting it.
controls.addEventListener('start', () => {
  viewer.classList.add('dragging');
  clearTimeout(autoCycleTimer);
});
controls.addEventListener('end', () => {
  viewer.classList.remove('dragging');
  scheduleAutoCycle();
});

function setPieceMesh(geo) {
  if (mesh) scene.remove(mesh);
  mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  scene.add(mesh);
}

function fadeMaterial(from, to, ms) {
  return new Promise(resolve => {
    material.transparent = true;
    material.opacity = from;
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / ms);
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      material.opacity = from + (to - from) * eased;
      if (t < 1) requestAnimationFrame(tick);
      else {
        if (to === 1) material.transparent = false;
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

async function showPiece(idx, animate = true, onProgress) {
  if (isTransitioning || (idx === currentIdx && mesh)) return;
  isTransitioning = true;
  const p = PIECES[idx];
  updateDots(idx);
  try {
    const geo = await loadPiece(idx, onProgress);
    if (animate && mesh) {
      pieceName.classList.add('fading');
      await fadeMaterial(1, 0, 200);
      setPieceMesh(geo);
      pieceName.textContent = p.name;
      currentIdx = idx;
      pieceName.classList.remove('fading');
      await fadeMaterial(0, 1, 260);
    } else {
      setPieceMesh(geo);
      pieceName.textContent = p.name;
      currentIdx = idx;
    }
    scheduleAutoCycle();
  } catch (e) {
    console.error('Could not load piece', e);
  } finally {
    isTransitioning = false;
  }
}

function updateDots(activeIdx) {
  Array.from(dotsRow.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === activeIdx);
  });
}

PIECES.forEach((p, i) => {
  const dot = document.createElement('button');
  dot.className = 'viewer-dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', p.name);
  dot.addEventListener('click', (e) => { e.stopPropagation(); showPiece(i); });
  dotsRow.appendChild(dot);
});

function resize() {
  const w = viewer.clientWidth;
  const h = viewer.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const ro = new ResizeObserver(resize);
ro.observe(viewer);

// Click cycles to the next piece. We rely on the browser's native click
// detection (which cancels click if pointer moved >~5px between down/up),
// plus a guard that skips cycling if OrbitControls actually rotated the
// camera by more than a tiny threshold during this press.
let azimuthAtDown = null;
const ROTATION_THRESHOLD = 0.015; // radians (~0.9°)

viewer.addEventListener('pointerdown', () => {
  azimuthAtDown = controls.getAzimuthalAngle();
});

viewer.addEventListener('click', (e) => {
  const azNow = controls.getAzimuthalAngle();
  const rotated = azimuthAtDown !== null
    && Math.abs(azNow - azimuthAtDown) > ROTATION_THRESHOLD;
  azimuthAtDown = null;
  if (rotated) return;
  showPiece((currentIdx + 1) % PIECES.length);
});

// Keyboard accessibility — Enter/Space cycles
viewer.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    showPiece((currentIdx + 1) % PIECES.length);
  }
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Kick off immediately. Real load progress drives the bar's TARGET; a
// RAF tween smoothly catches the displayed value up so even an instant
// (cached) load animates 0→100 over ~1.2s, feeling intentional.
const LOADING_MIN_MS = 1200;
const t0 = performance.now();

let realProgress = 0;
let displayedProgress = 0;
let loadDone = false;
let pageRevealed = false;

function tickProgressBar() {
  // Smoothly lerp displayed toward realProgress, with a guaranteed
  // minimum advance per frame so the bar always feels alive.
  const target = realProgress;
  const lerpStep = (target - displayedProgress) * 0.06;
  const minStep = loadDone ? 0.008 : 0.003;
  displayedProgress = Math.min(target, displayedProgress + Math.max(lerpStep, minStep));
  setLoadingProgress(displayedProgress * 100);

  const elapsed = performance.now() - t0;
  const minTimeMet = elapsed >= LOADING_MIN_MS;
  if (loadDone && displayedProgress >= 0.999 && minTimeMet && !pageRevealed) {
    pageRevealed = true;
    setLoadingProgress(100);
    document.body.classList.add('page-ready');
    viewer.classList.add('loaded');
    requestAnimationFrame(animate);
    return;
  }
  requestAnimationFrame(tickProgressBar);
}

resize();
requestAnimationFrame(tickProgressBar);

showPiece(0, false, (p) => { realProgress = Math.max(realProgress, p); })
  .then(() => { realProgress = 1; loadDone = true; })
  .catch(err => {
    console.error(err);
    realProgress = 1;
    loadDone = true;
  });
</script>

</body>
</html>
